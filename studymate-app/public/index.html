<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="studymate-app" content="1">
<title>StudyMate AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5FB;--surface:#FFFFFF;--ink:#14213D;--ink-2:#4B5876;--line:#D5DCEB;--grid:rgba(20,33,61,.05);
  --accent:#2C50D0;--on-accent:#FFFFFF;--hi:#FFD23F;--on-hi:#14213D;
  --good:#1E8E5A;--warn:#D98A1B;--bad:#C93A52;--soft:#E9EEFB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1426;--surface:#152039;--ink:#E9EEFF;--ink-2:#9CAAC9;--line:#26355A;--grid:rgba(160,185,255,.055);
    --accent:#84A0FF;--on-accent:#0D1426;--hi:#FFD23F;--on-hi:#14213D;
    --good:#4CD08F;--warn:#F0A63A;--bad:#FF7A90;--soft:#1B2A4D;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1426;--surface:#152039;--ink:#E9EEFF;--ink-2:#9CAAC9;--line:#26355A;--grid:rgba(160,185,255,.055);
  --accent:#84A0FF;--on-accent:#0D1426;--hi:#FFD23F;--on-hi:#14213D;
  --good:#4CD08F;--warn:#F0A63A;--bad:#FF7A90;--soft:#1B2A4D;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;line-height:1.55;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em;font-weight:800}
h1{font-size:clamp(1.9rem,4vw,2.6rem)}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
h4{font-size:1rem;margin:12px 0 4px}
p{margin:0 0 .7em}
small,.muted{color:var(--ink-2)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.mark{align-self:flex-start;background:var(--hi);color:var(--on-hi);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.25rem;padding:1px 9px;border-radius:5px;transform:rotate(-1.5deg)}
.brand small{font-size:.8rem}
nav{display:flex;flex-direction:column;gap:3px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--ink);text-align:left;font-weight:600}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--hi);color:var(--on-hi)}
.nav svg{flex:none}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.who{font-weight:700;display:flex;flex-direction:column;line-height:1.25}
.who small{font-weight:500}
.main{padding:30px clamp(16px,4vw,52px) 60px;max-width:1120px;width:100%}
.stack>*+*{margin-top:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.head p{margin:6px 0 0;color:var(--ink-2)}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel>h3{margin-bottom:12px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.strip>div{background:var(--surface);padding:16px 18px}
.strip .num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:2rem;line-height:1.1}
.strip small{display:block;margin-top:2px}
.note{border-left:4px solid var(--hi);background:var(--surface);border-radius:0 10px 10px 0;padding:12px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
.note.good{border-left-color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600}
.pill.hi{background:var(--hi);color:var(--on-hi);border-color:transparent}
.pill.dim{color:var(--ink-2);font-weight:500}
.pill.ok{border-color:var(--good)}
.pill button{border:0;background:none;color:inherit;padding:0 0 0 2px;font-size:1rem;line-height:1}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.hi{background:var(--hi);color:var(--on-hi);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:120px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.field{margin-bottom:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem;color:var(--ink)}
.chip:hover{border-color:var(--accent)}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth .left{padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;justify-content:center;gap:22px;background:var(--ink);color:var(--paper)}
.auth .left h1{color:var(--paper)}
.auth .left .mark{font-size:1.4rem}
.auth .left ul{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.auth .left li{display:grid;gap:2px;padding-left:16px;border-left:3px solid var(--hi)}
.auth .left li span{opacity:.8}
.auth .right{padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;max-width:520px;width:100%;margin:0 auto}
.auth .demo{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .t{display:flex;flex-direction:column;min-width:0}
.list .t b{overflow-wrap:anywhere}
.done b{text-decoration:line-through;color:var(--ink-2)}
.check{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.subj{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;margin:10px 0}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:inherit}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:56vh;overflow:auto;padding:4px 2px}
.msg{max-width:88%;padding:11px 15px;border-radius:14px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:.3em 0 .6em;padding-left:1.3em}
.msg pre,.out pre{background:var(--soft);padding:10px 12px;border-radius:8px;overflow:auto;font-size:.88rem}
.msg code,.out code{background:var(--soft);padding:1px 5px;border-radius:5px}
.out{margin-top:16px}
.out ul,.out ol{padding-left:1.3em}
.think{color:var(--ink-2);font-style:italic}

/* quiz + cards */
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;margin-bottom:10px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:26px;border:2px solid var(--ink);border-radius:16px;background:var(--surface);box-shadow:6px 6px 0 var(--hi)}
.flash .side-tag{font-size:.8rem;color:var(--ink-2);font-weight:600}
.flash .big{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.4rem;font-weight:600}

/* focus timer */
.timer{text-align:center;padding:28px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.digits{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(4rem,15vw,7.5rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sweep{height:16px;border-radius:4px;background:var(--soft);margin:14px auto 0;max-width:460px;overflow:hidden;transform:rotate(-.6deg)}
.sweep>i{display:block;height:100%;background:var(--hi);transition:width 1s linear}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:20;border-right:0;border-top:1px solid var(--line);gap:0;align-items:center}
  .brand,.sidefoot .who{display:none}
  nav{flex-direction:row;overflow-x:auto;flex:1;gap:2px}
  .nav{flex-direction:column;gap:2px;padding:6px 10px;font-size:.72rem;white-space:nowrap}
  .sidefoot{margin:0;flex-direction:column;gap:2px}
  .sidefoot .btn{padding:3px 8px;font-size:.7rem}
  .sidefoot .btn svg{display:none}
  .main{padding-bottom:110px}
  .auth{grid-template-columns:1fr}
  .subj{grid-template-columns:90px 1fr 40px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const dstr=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const addDays=(n,d=new Date())=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const fmtDate=k=>new Date(k+'T00:00').toLocaleDateString('en',{day:'numeric',month:'short'});
const ICON={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
  cards:'<rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/>',
  plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'
};
const ico=n=>'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';

/* ---------- storage (per-browser prototype) ---------- */
const KEY='studymate_v1';
const blank=()=>({users:[],me:null,profiles:{},focus:[],quizzes:[],tasks:[],cards:[],links:[],goals:{},messages:[],blocklist:{},chats:{},notes:{},active:null,theme:null});
function loadDB(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}return blank()}
let DB=loadDB();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function applyTheme(){const r=document.documentElement;if(DB.theme)r.setAttribute('data-theme',DB.theme);else r.removeAttribute('data-theme')}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3400)}

const me=()=>DB.users.find(u=>u.id===DB.me)||null;
const prof=id=>DB.profiles[id]||null;
const goalOf=sid=>(DB.goals[sid]&&DB.goals[sid].minutes)||60;
const DEFAULT_BLOCK=['instagram.com','youtube.com','facebook.com','x.com','snapchat.com','reddit.com','tiktok.com'];
const blocklist=sid=>DB.blocklist[sid]||(DB.blocklist[sid]=DEFAULT_BLOCK.slice());
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sm:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'plain:'+p}}
const newCode=()=>'SM-'+Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');

/* ---------- stats shared by student and parent panels ---------- */
function stats(sid){
  const F=DB.focus.filter(f=>f.sid===sid),Q=DB.quizzes.filter(q=>q.sid===sid),T=DB.tasks.filter(t=>t.sid===sid),C=DB.cards.filter(c=>c.sid===sid);
  const today=dstr(),minBy={};
  F.forEach(f=>{minBy[f.date]=(minBy[f.date]||0)+f.minutes});
  const week=[...Array(7)].map((_,i)=>{const d=addDays(i-6),k=dstr(d);return{k,label:d.toLocaleDateString('en',{weekday:'short'}),min:minBy[k]||0}});
  const active=new Set([...F.map(f=>f.date),...Q.map(q=>q.date)]);
  let streak=0,d=new Date();if(!active.has(dstr(d)))d=addDays(-1);
  while(active.has(dstr(d))){streak++;d=addDays(-1,d)}
  const last=[...active].sort().pop()||null;
  const subj={},topic={};
  Q.forEach(q=>{
    const a=subj[q.subject]||(subj[q.subject]={c:0,t:0});a.c+=q.score;a.t+=q.total;
    (q.items||[]).forEach(it=>{const k=q.subject+'|'+it.topic,b=topic[k]||(topic[k]={subject:q.subject,topic:it.topic,c:0,t:0});b.t++;if(it.ok)b.c++});
  });
  const weak=Object.values(topic).filter(x=>x.t>=2&&x.c/x.t<.6).sort((a,b)=>a.c/a.t-b.c/b.t).slice(0,5);
  const recent=Q.slice(-10),rs=recent.reduce((a,q)=>a+q.score,0),rt=recent.reduce((a,q)=>a+q.total,0);
  const tt=T.filter(t=>t.date===today);
  const wkStart=dstr(addDays(-6));
  const F7=F.filter(f=>f.date>=wkStart);
  return{
    week,weekMin:week.reduce((a,x)=>a+x.min,0),todayMin:minBy[today]||0,streak,last,subj,weak,
    quizAvg:rt?Math.round(rs/rt*100):null,quizCount:Q.length,
    tasksToday:{done:tt.filter(t=>t.done).length,total:tt.length},
    tasksDone:T.filter(t=>t.done).length,tasksTotal:T.length,
    planPct:T.length?Math.round(T.filter(t=>t.done).length/T.length*100):null,
    tabs7:F7.reduce((a,f)=>a+(f.tabs||0),0),blocked7:F7.reduce((a,f)=>a+(f.blocked||0),0),sessions7:F7.length,
    due:C.filter(c=>c.due<=today).length,cards:C.length,totalMin:F.reduce((a,f)=>a+f.minutes,0),sessions:F.length,
    perfect:Q.some(q=>q.score===q.total)
  };
}
function alertsFor(sid){
  const s=stats(sid),out=[];
  const idle=s.last?daysBetween(s.last,dstr()):null;
  if(idle===null)out.push({t:'bad',m:'No study activity yet.'});
  else if(idle>=2)out.push({t:'bad',m:'No study activity for '+idle+' days.'});
  if(s.quizAvg!==null&&s.quizCount>=2&&s.quizAvg<50)out.push({t:'warn',m:'Quiz average is low ('+s.quizAvg+'%). Extra revision may help.'});
  if(s.tabs7+s.blocked7>=8)out.push({t:'warn',m:(s.tabs7+s.blocked7)+' distractions during focus sessions this week.'});
  if(s.weak.length)out.push({t:'',m:'Weak topics: '+s.weak.slice(0,3).map(w=>w.topic).join(', ')+'.'});
  if(!out.length)out.push({t:'good',m:'On track. No alerts this week.'});
  return out;
}

/* ---------- demo data ---------- */
function seedDemo(){
  if(DB.users.some(u=>u.id==='demo-s'))return;
  DB.users.push({id:'demo-s',name:'Riya Sharma',email:'riya@demo.local',hash:'',role:'student',code:'SM-RIYA7'});
  DB.users.push({id:'demo-p',name:'Mr. Sharma',email:'parent@demo.local',hash:'',role:'parent'});
  DB.profiles['demo-s']={course:'Class 12 Science (CBSE)',subjects:['Mathematics','Physics','Chemistry'],goal:'Score 90% or more in boards',exam:dstr(addDays(38)),hours:3,style:'Practice-based',levels:{Mathematics:3,Physics:2,Chemistry:2}};
  let seed=11;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const subs=['Mathematics','Physics','Chemistry'];
  for(let i=13;i>=0;i--){
    if(i>0&&rnd()<.18)continue;
    const n=1+Math.floor(rnd()*3);
    for(let j=0;j<n;j++){
      const m=[25,25,30,45,50][Math.floor(rnd()*5)];
      DB.focus.push({id:uid(),sid:'demo-s',date:dstr(addDays(-i)),minutes:m,completed:true,subject:subs[Math.floor(rnd()*3)],tabs:rnd()<.5?Math.floor(rnd()*3):0,blocked:rnd()<.35?Math.floor(rnd()*3):0});
    }
  }
  const T={Mathematics:['Integration','Probability','Matrices','Differentiation'],Physics:['Optics','Electrostatics','Current electricity'],Chemistry:['Organic reactions','Equilibrium','Electrochemistry']};
  const weakSet=new Set(['Electrostatics','Equilibrium']);
  for(let k=0;k<9;k++){
    const subject=subs[k%3],items=[];
    for(let q=0;q<5;q++){
      const tp=T[subject][Math.floor(rnd()*T[subject].length)];
      const p=weakSet.has(tp)?.25:(subject==='Mathematics'?.85:.65);
      items.push({topic:tp,ok:rnd()<p});
    }
    DB.quizzes.push({id:uid(),sid:'demo-s',date:dstr(addDays(-(12-k))),subject,level:2,score:items.filter(x=>x.ok).length,total:5,items});
  }
  const td=dstr(),tm=dstr(addDays(1));
  [['Mathematics','Integration: 10 practice problems',45,td,true],['Physics','Electrostatics: Gauss law revision',40,td,false],['Chemistry','Equilibrium: numericals',40,td,false],
   ['Physics','Optics: ray diagrams',30,tm,false],['Mathematics','Probability past papers',50,tm,false],['Chemistry','Organic reactions summary',35,dstr(addDays(-1)),true],['Mathematics','Matrices worksheet',40,dstr(addDays(-2)),true]]

function parseJsonLoose(t){
  const s=String(t||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(s)}catch(e){}
  const a=s.search(/[\[{]/),z=Math.max(s.lastIndexOf(']'),s.lastIndexOf('}'));
  if(a>=0&&z>a){try{return JSON.parse(s.slice(a,z+1))}catch(e){}}
  throw{code:'invalid_json'};
}
async function serverChat(input,opts){
  opts=opts||{};
  let messages=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:m.content}));
  let system=opts.system||'';
  // the tutor sends its rules as a leading user turn; the server API takes them as a system prompt
  if(messages.length>1&&messages[0].role==='user'&&messages[1].role==='user'){system=messages[0].content;messages=messages.slice(1)}
  let res;
  try{
    res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},signal:opts.signal,
      body:JSON.stringify({system,messages,stream:!!opts.onText,maxTokens:opts.maxTokens||1200})});
  }catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled',text:''};throw{code:'upstream_error'}}
  if(!res.ok){let j={};try{j=await res.json()}catch(e){}throw{code:j.code||'upstream_error'}}
  if(!opts.onText){const j=await res.json();if(!j.text)throw{code:'empty_completion'};return{text:j.text}}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',acc='';
  try{
    for(;;){
      const r=await rd.read();if(r.done)break;
      buf+=dec.decode(r.value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const ev=buf.slice(0,i);buf=buf.slice(i+2);
        const line=ev.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
        const data=line.slice(5).trim();if(data==='[DONE]')continue;
        let j;try{j=JSON.parse(data)}catch(x){continue}
        if(j.error)throw{code:j.error,text:acc};
        if(j.delta){acc+=j.delta;opts.onText({text:acc,delta:j.delta})}
      }
    }
  }catch(e){
    if(e&&e.name==='AbortError')throw{code:'cancelled',text:acc};
    if(e&&e.code)throw e;
    throw{code:'upstream_error',text:acc};
  }
  if(!acc)throw{code:'empty_completion'};
  return{text:acc};
}
serverChat.json=async(prompt,opts)=>{
  const o=Object.assign({},opts,{onText:null,system:'You are a JSON API. Reply with only valid JSON. No explanation and no markdown fences.',maxTokens:(opts&&opts.maxTokens)||3000});
  const r=await serverChat(prompt,o);
  return parseJsonLoose(r.text);
};

function md(t){
  const codes=[];
  let s=String(t).replace(/```[a-z]*\n?([\s\S]*?)```/g,(m,c)=>{codes.push(c.replace(/\n$/,''));return'\u0000'+(codes.length-1)+'\u0000'});
  s=esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  let out='',list=null;const close=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const raw of s.split('\n')){
    const line=raw.trimEnd();let m;
    if((m=line.match(/^\s*[-*\u2022]\s+(.*)/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+m[1]+'</li>'}
    else if((m=line.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+m[1]+'</li>'}
    else if((m=line.match(/^#{1,4}\s+(.*)/))){close();out+='<h4>'+m[1]+'</h4>'}
    else if(!line.trim()){close()}
    else{close();out+='<p>'+line+'</p>'}
  }
  close();
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<pre>'+esc(codes[+i])+'</pre>');
}

function barChart(week,goal){
  const W=420,H=170,pad=18,bw=34,max=Math.max(goal,...week.map(x=>x.min),30)*1.12,gap=(W-pad*2-bw*7)/6,base=H-26,top=22;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Focus minutes for the last 7 days">';
  const gy=base-(goal/max)*(base-top);
  s+='<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ink-2)" stroke-dasharray="4 4"/><text x="'+(W-pad)+'" y="'+(gy-5)+'" text-anchor="end" font-size="11" fill="var(--ink-2)">goal '+goal+' min</text>';
  week.forEach((d,i)=>{
    const x=pad+i*(bw+gap),h=(d.min/max)*(base-top),y=base-h,t=i===6;
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+(d.min?Math.max(h,3):0)+'" rx="5" fill="'+(t?'var(--hi)':'var(--accent)')+'"'+(t?' stroke="var(--ink)" stroke-width="1.2"':'')+'/>';
    if(d.min)s+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" fill="var(--ink)">'+d.min+'</text>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--ink-2)">'+d.label+'</text>';
  });
  return s+'</svg>';
}

  chat.forEach(m=>{h+='<div class="msg '+(m.role==='user'?'u':'a')+'">'+(m.role==='user'?esc(m.content).replace(/\n/g,'<br>'):md(m.content))+'</div>'});
  if(TUT.busy)h+='<div class="msg a"><div id="tOut"><span class="think">Thinking...</span></div></div>';

    '<div class="row" style="margin-top:14px;align-items:flex-end"><div style="flex:1;min-width:220px"><label for="tIn" class="sr">Your question</label><textarea id="tIn" rows="2" style="min-height:0" placeholder="Type your doubt here"'+(TUT.busy?' disabled':'')+'></textarea></div>'+

}

    '<div class="field"><label for="qzTopic">Topic (optional)</label><input id="qzTopic" value="'+esc(pre.topic||'')+'" placeholder="For example: Electrostatics"></div>'+

    '<div class="panel"><h3>Practice your weak topics</h3>'+(s.weak.length?'<div class="chips">'+s.weak.map(w=>'<button class="chip" data-a="quizFor" data-v="'+esc(w.subject)+'" data-tp="'+esc(w.topic)+'">'+esc(w.topic)+'</button>').join('')+'</div>':'<p class="muted">Weak topics show up here after you answer a few questions.</p>')+

  const L=DB.links.filter(l=>l.pid===u.id);
  return '<div class="stack" style="max-width:720px"><div class="head"><div><h1>Link a child</h1><p>Enter the code from your child\'s Profile page. They approve the request.</p></div></div>'+
    '<form class="panel" data-form="link"><div class="field"><label for="lCode">Link code</label><input id="lCode" name="code" placeholder="SM-XXXXX" style="text-transform:uppercase" required></div>'+(LK.msg?'<p class="note" role="status">'+esc(LK.msg)+'</p>':'')+'<button class="btn pri">Send request</button></form>'+
    '<div class="panel"><h3>Your requests</h3>'+(L.length?'<ul class="list">'+L.map(l=>{const c=DB.users.find(x=>x.id===l.sid);return'<li><div class="t"><b>'+esc(c?c.name:'Student')+'</b><small>'+(l.status==='approved'?'Approved':l.status==='pending'?'Waiting for approval':'Declined')+'</small></div>'+(l.status==='approved'?'<button class="btn sm" data-a="pOpen" data-id="'+l.sid+'">View progress</button>':'')+'</li>'}).join('')+'</ul>':'<p class="muted">No requests yet.</p>')+
    '<p class="muted" style="font-size:.88rem;margin-top:10px">Demo tip: the demo student\'s code is <b>SM-RIYA7</b>.</p></div></div>';
}

/* ---------- render ---------- */
function render(){
  const u=me(),root=$('#root');
  applyTheme();
  if(!u){root.innerHTML=viewAuth();return}
  let body;
  if(u.role==='student'){
    if(!prof(u.id)){root.innerHTML='<div class="main" style="margin:0 auto">'+viewOnboard(u,false)+'</div>';return}
    if(!NAV_S.some(n=>n[0]===route))route='dash';
    body=({dash:viewDash,tutor:viewTutor,notes:viewNotes,quiz:viewQuiz,cards:viewCards,plan:viewPlan,focus:viewFocus,profile:viewProfile})[route](u);
  }else{
    if(!NAV_P.some(n=>n[0]===route))route='progress';
    body=(route==='link'?viewLink:viewProgress)(u);
  }
  root.innerHTML=shell(u,body);
  updateExtBadge();
  const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;
  if(route==='focus')extSend({type:'PING'});
}
function go(r){route=r;TUT.err=null;NT.err='';PL.err='';PS.err='';window.scrollTo(0,0);render()}
const val=(f,n)=>f.elements[n]?f.elements[n].value:'';

/* ---------- focus timer ---------- */
let WL=null;
async function wake(on){try{if(on){if(navigator.wakeLock&&!WL)WL=await navigator.wakeLock.request('screen')}else if(WL){await WL.release();WL=null}}catch(e){WL=null}}
function startFocus(){
  const u=me(),mins=Math.min(180,Math.max(5,Number($('#fMin').value)||25));
  DB.active={sid:u.id,start:Date.now(),endsAt:Date.now()+mins*6e4,minutes:mins,subject:$('#fSubj').value,tabs:0,blocked:0};
  save();FC.exitOpen=false;
  extSend({type:'START',domains:blocklist(u.id),endsAt:DB.active.endsAt});
  wake(true);render();
}
function finishFocus(completed){
  const a=DB.active;if(!a)return;
  const mins=completed?a.minutes:Math.floor((Date.now()-a.start)/6e4),id=uid();
  if(mins>=1)DB.focus.push({id,sid:a.sid,date:dstr(new Date(a.start)),minutes:mins,completed,subject:a.subject,tabs:a.tabs,blocked:a.blocked});
  DB.active=null;FC.exitOpen=false;save();
  extSend({type:'STOP',sessionId:id});wake(false);document.title='StudyMate AI';
  toast(completed?'Session complete. Take a 5 minute break.':'Session ended. '+mins+' minutes saved.');
  if(route==='focus'||route==='dash')render();
}
function tick(){
  const a=DB.active;if(!a)return;
  const left=a.endsAt-Date.now();
  if(left<=0){finishFocus(true);return}
  const d=$('#tDigits');
  if(d){d.textContent=fmtClock(left);const b=$('#tBar');if(b)b.style.width=Math.min(100,(1-left/(a.minutes*6e4))*100).toFixed(1)+'%';const t=$('#tTabs');if(t)t.textContent=a.tabs;const k=$('#tBlk');if(k)k.textContent=a.blocked}
  document.title=fmtClock(left)+' Focus';
}
document.addEventListener('visibilitychange',()=>{const a=DB.active;if(a&&document.hidden){a.tabs++;save()}});

/* ---------- AI flows ---------- */
async function tutorSend(text){
  const u=me(),p=prof(u.id),box=$('#tIn');
  text=(text||(box&&box.value)||'').trim();
  if(!text||TUT.busy)return;
  if(!SAMPLE){TUT.err=AIERR.no_ai;return render()}
  const chat=DB.chats[u.id]||(DB.chats[u.id]=[]);
  chat.push({role:'user',content:text});TUT.busy=true;TUT.err=null;TUT.ctl=new AbortController();
  render();
  let hist=chat.slice(-12);const fu=hist.findIndex(m=>m.role==='user');hist=hist.slice(Math.max(0,fu));
  const turns=[{role:'user',content:tutorRules(u,p)}].concat(hist.map(m=>({role:m.role,content:m.content})));
  try{
    const r=await SAMPLE(turns,{cache:false,modelTier:'quick',signal:TUT.ctl.signal,onText:({text})=>{const o=$('#tOut');if(o){o.innerHTML=md(text);const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}}});
    chat.push({role:'assistant',content:r.text});
  }catch(e){
    if(e.text)chat.push({role:'assistant',content:e.text+'\n\n(interrupted)'});
    else if(e.code!=='cancelled')TUT.err=aiMsg(e);
  }
  if(chat.length>40)chat.splice(0,chat.length-40);
  TUT.busy=false;save();if(route==='tutor')render();
}
async function notesRun(kind){
  const u=me(),p=prof(u.id),text=($('#notesText').value||'').trim(),subject=$('#nSubj').value;
  DB.notes[u.id]=text;NT.subject=subject;save();
  if(text.length<40){NT.err='Add a bit more text first, at least a couple of sentences.';NT.out='';return render()}
  if(!SAMPLE){NT.err=AIERR.no_ai;return render()}
  const body=text.slice(0,30000);
  NT.busy=true;NT.err='';NT.out='';NT.ctl=new AbortController();render();
  try{
    if(kind==='sum'){
      const r=await SAMPLE('Summarize these '+subject+' study notes for a '+p.course+' student. Give a 3 sentence summary, then 5 to 7 key points as a bullet list, then 3 likely exam questions as a numbered list. Notes:\n\n'+body,{modelTier:'default',signal:NT.ctl.signal,onText:({text})=>{NT.out=text;const o=$('#notesOut');if(o)o.innerHTML=md(text)}});
      NT.out=r.text;
    }else{
      const arr=await SAMPLE.json('Create 8 flashcards from these '+subject+' study notes. Reply with only a JSON array like [{"front":"question or term","back":"short answer"}]. Keep each back under 25 words.\n\nNotes:\n'+body,{modelTier:'default',signal:NT.ctl.signal});
      const ok=(Array.isArray(arr)?arr:[]).filter(c=>c&&typeof c.front==='string'&&typeof c.back==='string');
      if(!ok.length)throw{code:'invalid_json'};
      ok.slice(0,12).forEach(c=>DB.cards.push({id:uid(),sid:u.id,front:c.front,back:c.back,subject,box:1,due:dstr()}));
      save();NT.out='**Saved '+Math.min(ok.length,12)+' flashcards** to your '+subject+' deck. Open Flashcards to review them.';
    }
  }catch(e){if(e.code!=='cancelled')NT.err=aiMsg(e)}
  NT.busy=false;if(route==='notes')render();
}
async function startQuiz(o){
  const u=me(),p=prof(u.id);
  QZ.subject=o.subject;QZ.topic=o.topic||'';QZ.source=o.source||null;QZ.level=(p.levels&&p.levels[o.subject])||2;QZ.stage='loading';QZ.err=null;QZ.prefill=null;
  const ctl=QZ.ctl=new AbortController();route='quiz';render();
  const lv=['','easy recall questions','standard exam-style questions','challenging application questions'][QZ.level];
  const prompt='Write 5 multiple-choice questions for a '+p.course+' student on '+QZ.subject+(QZ.topic?', topic: '+QZ.topic:'')+(QZ.source?', based only on these notes:\n'+QZ.source.slice(0,12000)+'\n':'')+'. Difficulty: '+lv+'. Each question has exactly 4 options and one correct answer. Reply with only a JSON array like [{"q":"...","options":["...","...","...","..."],"answer":0,"topic":"short sub-topic name","explain":"one sentence"}] where answer is the index 0 to 3 of the correct option.';
  try{
    if(!SAMPLE)throw{code:'no_ai'};
    const data=await SAMPLE.json(prompt,{modelTier:'default',signal:ctl.signal});
    if(QZ.ctl!==ctl)return;
    const qs=(Array.isArray(data)?data:[]).filter(q=>q&&typeof q.q==='string'&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4).slice(0,5);
    if(qs.length<3)throw{code:'invalid_json'};
    QZ.qs=qs;QZ.i=0;QZ.picked=null;QZ.answers=[];QZ.stage='run';
  }catch(e){if(QZ.ctl!==ctl)return;QZ.stage='setup';if(e.code!=='cancelled')QZ.err=aiMsg(e)}
  if(route==='quiz')render();
}
function finishQuiz(){
  const u=me(),p=prof(u.id),score=QZ.answers.filter(a=>a.ok).length,total=QZ.qs.length,ol=QZ.level;
  let nl=ol;if(score/total>=.8)nl=Math.min(3,ol+1);else if(score/total<=.4)nl=Math.max(1,ol-1);
  DB.quizzes.push({id:uid(),sid:u.id,date:dstr(),subject:QZ.subject,level:ol,score,total,items:QZ.answers.map(a=>({topic:a.topic,ok:a.ok}))});
  p.levels=p.levels||{};p.levels[QZ.subject]=nl;
  QZ.result={score,total,ol,nl};QZ.stage='result';QZ.source=null;save();render();
}
async function planAI(){
  const u=me(),p=prof(u.id),s=stats(u.id);
  if(!SAMPLE){PL.err=AIERR.no_ai;return render()}
  PL.busy=true;PL.err='';render();
  const days=p.exam?daysBetween(dstr(),p.exam):null;
  const prompt='Create a 7 day study plan (day 0 is today, '+dstr()+'). Student: '+p.course+'. Subjects: '+p.subjects.join(', ')+'. Goal: '+(p.goal||'do well')+'. Exam in '+(days===null?'an unknown number of':days)+' days. Study time available: '+p.hours+' hours per day. Preferred style: '+p.style+'. Weak topics: '+(s.weak.map(w=>w.topic+' ('+w.subject+')').join(', ')||'none known yet')+'. Put weak topics first, mix subjects, add a short revision task on day 3 and day 6, and keep each day within the daily hours. Give 2 to 4 tasks per day. Reply with only a JSON array like [{"day":0,"subject":"Physics","title":"Electrostatics: Coulomb law practice","minutes":45}].';
  try{
    const arr=await SAMPLE.json(prompt,{modelTier:'default'});
    const ok=(Array.isArray(arr)?arr:[]).filter(t=>t&&typeof t.title==='string'&&Number.isInteger(t.day)&&t.day>=0&&t.day<=6);
    if(ok.length<3)throw{code:'invalid_json'};
    DB.tasks=DB.tasks.filter(t=>!(t.sid===u.id&&t.ai&&!t.done&&t.date>=dstr()));
    ok.forEach(t=>DB.tasks.push({id:uid(),sid:u.id,subject:String(t.subject||p.subjects[0]),title:t.title,minutes:Math.min(240,Math.max(10,Math.round(Number(t.minutes)||30))),date:dstr(addDays(t.day)),done:false,ai:true}));
    save();toast('Added '+ok.length+' tasks to your plan.');
  }catch(e){PL.err=aiMsg(e)}
  PL.busy=false;if(route==='plan')render();
}
async function parentSummary(){
  const k=DB.users.find(x=>x.id===PS.child),p=prof(k.id),s=stats(k.id);
  if(!SAMPLE){PS.err=AIERR.no_ai;return render()}
  PS.busy=true;PS.err='';render();
  const data={name:k.name.split(' ')[0],course:p.course,focusMinutesThisWeek:s.weekMin,dailyGoalMinutes:goalOf(k.id),streakDays:s.streak,planCompletedPercent:s.planPct,quizAveragePercent:s.quizAvg,
    subjectAccuracyPercent:Object.fromEntries(Object.entries(s.subj).map(([n,a])=>[n,Math.round(a.c/a.t*100)])),weakTopics:s.weak.map(w=>w.topic),distractionsThisWeek:s.tabs7+s.blocked7,daysToExam:p.exam?daysBetween(dstr(),p.exam):null};
  try{
    const r=await SAMPLE('You write a short, warm weekly progress note for a parent about their child\'s studying. Use only the data below and do not invent facts. Maximum 100 words, plain language. Include one strength, one thing to work on, and one thing the parent can do to help.\n\nData: '+JSON.stringify(data),{modelTier:'default'});
    PS.summary=r.text;
  }catch(e){PS.err=aiMsg(e)}
  PS.busy=false;if(route==='progress')render();
}

/* ---------- click actions ---------- */
const A={
  go:b=>go(b.dataset.r||b.dataset.v),
  mode:()=>{authMode=authMode==='login'?'signup':'login';authErr='';render()},
  role:b=>{authRole=b.dataset.v;authErr='';render()},
  theme:()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!DB.theme&&matchMedia('(prefers-color-scheme: dark)').matches);DB.theme=dark?'light':'dark';save();render()},
  logout:()=>{DB.me=null;authErr='';save();render()},
  demoS:()=>{seedDemo();DB.me='demo-s';route='dash';save();render()},
  demoP:()=>{seedDemo();DB.me='demo-p';route='progress';PS.child='demo-s';PS.summary='';save();render()},
  approve:b=>{const l=DB.links.find(x=>x.id===b.dataset.id);if(l){l.status='approved';save();toast('Parent can now view your progress.');render()}},
  reject:b=>{const l=DB.links.find(x=>x.id===b.dataset.id);if(l){l.status='rejected';save();render()}},
  revoke:b=>{DB.links=DB.links.filter(x=>x.id!==b.dataset.id);save();render()},
  readMsg:b=>{const m=DB.messages.find(x=>x.id===b.dataset.id);if(m){m.read=true;save();render()}},
  copyCode:()=>{const c=me().code;try{navigator.clipboard.writeText(c).then(()=>toast('Code copied.'),()=>toast('Code: '+c))}catch(e){toast('Code: '+c)}},
  quizFor:b=>{QZ.stage='setup';QZ.prefill={subject:b.dataset.v,topic:b.dataset.tp||''};go('quiz')},
  chip:b=>tutorSend(b.dataset.v),
  clearChat:()=>{DB.chats[me().id]=[];save();render()},
  tutorSend:()=>tutorSend(),
  tutorStop:()=>{TUT.ctl&&TUT.ctl.abort()},
  notesSum:()=>notesRun('sum'),
  notesCards:()=>notesRun('cards'),
  notesStop:()=>{NT.ctl&&NT.ctl.abort()},
  notesQuiz:()=>{
    const u=me(),t=($('#notesText').value||'').trim();
    if(t.length<40){NT.err='Add a bit more text first, at least a couple of sentences.';return render()}
    DB.notes[u.id]=t;save();startQuiz({subject:$('#nSubj').value,source:t});
  },
  qzStart:()=>startQuiz({subject:$('#qzSubject').value,topic:($('#qzTopic').value||'').trim()}),
  qzCancel:()=>{QZ.ctl&&QZ.ctl.abort();QZ.ctl=null;QZ.stage='setup';QZ.err=null;render()},
  qzPick:b=>{if(QZ.picked!==null)return;const i=+b.dataset.i,q=QZ.qs[QZ.i];QZ.picked=i;QZ.answers.push({ok:i===q.answer,topic:q.topic||QZ.topic||QZ.subject});render()},
  qzNext:()=>{if(QZ.i+1<QZ.qs.length){QZ.i++;QZ.picked=null;render()}else finishQuiz()},
  qzAgain:()=>{QZ.stage='setup';QZ.prefill={subject:QZ.subject,topic:''};render()},
  cardsStart:()=>{const t=dstr();CR.queue=DB.cards.filter(c=>c.sid===me().id&&c.due<=t).map(c=>c.id);CR.i=0;CR.show=false;render()},
  cardsStop:()=>{CR.queue=null;render()},
  cardShow:()=>{CR.show=true;render()},
  cardKnew:()=>{const c=DB.cards.find(x=>x.id===CR.queue[CR.i]);if(c){c.box=Math.min(6,(c.box||1)+1);c.due=dstr(addDays([1,2,4,7,14,30][c.box-1]))}CR.i++;CR.show=false;save();render()},
  cardAgain:()=>{const c=DB.cards.find(x=>x.id===CR.queue[CR.i]);if(c){c.box=1;c.due=dstr(addDays(1));if(CR.queue.length<40)CR.queue.push(c.id)}CR.i++;CR.show=false;save();render()},
  taskToggle:b=>{const t=DB.tasks.find(x=>x.id===b.dataset.id);if(t){t.done=b.checked;save();render()}},
  taskDel:b=>{DB.tasks=DB.tasks.filter(x=>x.id!==b.dataset.id);save();render()},
  planAI:()=>planAI(),
  fPreset:b=>{$('#fMin').value=b.dataset.m},
  extCheck:()=>{EXT.ok=false;extSend({type:'PING'});setTimeout(()=>{updateExtBadge();toast(EXT.ok?'Extension connected.':'Extension still not detected. See the steps below.')},700)},
  fStart:()=>startFocus(),
  fExitOpen:()=>{FC.exitOpen=true;render()},
  fExitClose:()=>{FC.exitOpen=false;render()},
  fExit:()=>finishFocus(false),
  blkDel:b=>{const u=me();DB.blocklist[u.id]=blocklist(u.id).filter(d=>d!==b.dataset.v);save();render()},
  pChild:b=>{PS.child=b.dataset.id;PS.summary='';PS.err='';render()},
  pOpen:b=>{PS.child=b.dataset.id;PS.summary='';go('progress')},
  pSummary:()=>parentSummary(),
  pChip:b=>{const i=$('#mTxt');if(i){i.value=b.dataset.v;i.focus()}}
};

/* ---------- form submits ---------- */
const FM={
  auth:async f=>{
    const email=val(f,'email').trim().toLowerCase(),pass=val(f,'pass'),name=val(f,'name').trim();
    authErr='';const h=await hash(pass);
    if(authMode==='signup'){
      if(DB.users.some(u=>u.email===email)){authErr='An account with this email already exists. Sign in instead.';return render()}
      const u={id:uid(),name,email,hash:h,role:authRole};
      if(authRole==='student')u.code=newCode();
      DB.users.push(u);DB.me=u.id;
    }else{
      const u=DB.users.find(x=>x.email===email&&x.hash===h&&x.role===authRole);
      if(!u){authErr='Email, password or role does not match. Check the role selected above.';return render()}
      DB.me=u.id;
    }
    route=authRole==='student'?'dash':'progress';PS.child=null;save();render();
  },
  onboard:f=>{
    const u=me(),old=prof(u.id)||{};
    const subjects=val(f,'subjects').split(',').map(x=>x.trim()).filter(Boolean).slice(0,8);
    DB.profiles[u.id]={course:val(f,'course').trim(),subjects,goal:val(f,'goal').trim(),exam:val(f,'exam'),hours:Number(val(f,'hours'))||2,style:val(f,'style'),levels:old.levels||{}};
    save();toast('Profile saved.');render();
  },
  cardAdd:f=>{DB.cards.push({id:uid(),sid:me().id,front:val(f,'front').trim(),back:val(f,'back').trim(),subject:val(f,'subject'),box:1,due:dstr()});save();toast('Card added.');render()},
  taskAdd:f=>{DB.tasks.push({id:uid(),sid:me().id,title:val(f,'title').trim(),subject:val(f,'subject'),minutes:Number(val(f,'minutes'))||30,date:val(f,'date')||dstr(),done:false});save();render()},
  blkAdd:f=>{
    const u=me();let d=val(f,'site').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
    if(!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(d)){toast('Enter a site like example.com');return}
    const l=blocklist(u.id);if(!l.includes(d))l.push(d);save();render();
  },
  goal:f=>{DB.goals[PS.child]={minutes:Math.min(600,Math.max(10,Number(val(f,'minutes'))||60))};save();toast('Daily goal saved.');render()},
  msg:f=>{const u=me(),t=val(f,'text').trim();if(!t)return;DB.messages.push({id:uid(),pid:u.id,sid:PS.child,text:t,date:dstr(),read:false});save();toast('Message sent.');render()},
  link:f=>{
    const u=me(),code=val(f,'code').trim().toUpperCase(),st=DB.users.find(x=>x.role==='student'&&x.code===code);
    if(!st){LK.msg='No student found with that code. Check it and try again.';return render()}
    const ex=DB.links.find(l=>l.pid===u.id&&l.sid===st.id);
    if(ex&&ex.status!=='rejected'){LK.msg=ex.status==='approved'?'You are already linked to '+st.name+'.':'Request already sent. Waiting for approval.';return render()}
    if(ex)ex.status='pending';else DB.links.push({id:uid(),pid:u.id,sid:st.id,status:'pending'});
    LK.msg='Request sent to '+st.name+'. They need to approve it from their account.';save();render();
  }
};
const CH={
  tutorLevel:t=>{DB.tutorLevel=t.value;save()},
  notesSubject:t=>{NT.subject=t.value},
  notesFile:t=>{const f=t.files&&t.files[0];if(!f)return;if(f.size>500000){toast('That file is too large. Use a file under 500 KB.');return}const r=new FileReader();r.onload=()=>{const ta=$('#notesText');if(ta){ta.value=String(r.result);DB.notes[me().id]=ta.value;save()}};r.readAsText(f)},
  qzSubj:t=>{QZ.prefill={subject:t.value,topic:($('#qzTopic')||{}).value||''};render()}
};

/* ---------- events ---------- */
let nTimer;
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.type==='checkbox')return;const fn=A[b.dataset.a];if(fn)fn(b,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='taskToggle'){A.taskToggle(t);return}const c=t.dataset&&t.dataset.change;if(c&&CH[c])CH[c](t)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FM[f.dataset.form];if(fn)fn(f)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='notesText'){clearTimeout(nTimer);nTimer=setTimeout(()=>{const u=me();if(u){DB.notes[u.id]=t.value;save()}},400)}
  if(t.id==='exitPhrase'){const b=$('#exitBtn');if(b)b.disabled=t.value.trim().toLowerCase()!=='end focus session'}
});
document.addEventListener('keydown',e=>{if(e.target.id==='tIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();tutorSend()}});

/* ---------- start ---------- */
applyTheme();
if(DB.active&&DB.active.endsAt<Date.now())finishFocus(true);
setInterval(tick,1000);
render();
extSend({type:'PING'});
})();
</script>
